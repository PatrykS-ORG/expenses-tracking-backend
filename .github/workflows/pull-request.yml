name: Pull Request

on:
  pull_request:
    branches: [develop, production]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize PATH for self-hosted runner
        run: |
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '^/root/' | paste -sd: -)
          echo "PATH=$CLEAN_PATH" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize PATH for self-hosted runner
        run: |
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '^/root/' | paste -sd: -)
          echo "PATH=$CLEAN_PATH" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint .

  prettier:
    name: Prettier
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize PATH for self-hosted runner
        run: |
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '^/root/' | paste -sd: -)
          echo "PATH=$CLEAN_PATH" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check
